[project]
name = "harness"
version = "0.1.0"
description = "Typed, unit-aware engineering design graphs with deterministic propagation and full provenance."
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.13",
    "pint>=0.24",
    "networkx>=3.3",
    "scipy>=1.14",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[project.scripts]
harness = "harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["harness"]
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sympy.*", "networkx.*", "pint.*"]
ignore_missing_imports = true
